name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test --configuration Release --no-build 2>&1 | tee test-output.txt
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots

      # The failed tests as one annotation, readable on the run summary page and through the API.
      - name: Report failed tests
        if: failure()
        shell: bash
        run: |
          # Drop the colour codes of the test output, then escape for an annotation.
          encode() { sed $'s/\x1b\\[[0-9;]*m//g' | tr -d '\r' | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }'; }
          failed=$( (sed $'s/\x1b\\[[0-9;]*m//g' test-output.txt | grep -E -A14 '^[[:space:]]*failed ' || true) | head -120 | encode)
          tail=$(tail -n 60 test-output.txt | encode)
          echo "::error title=Failed tests on ${{ matrix.os }}::${failed:-no 'failed' line: the test host may have crashed}"
          echo "::error title=End of test output on ${{ matrix.os }}::${tail}"

      - name: Upload UI screenshots
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      # The real application, not the headless test host: with the system set to
      # dark, the window must open dark (the theme setting defaults to "system").
      - name: Follow the dark system theme (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v AppsUseLightTheme /t REG_DWORD /d 0 /f
          $report = Join-Path $env:RUNNER_TEMP "theme.txt"
          $p = Start-Process -FilePath "src/MarelliIawEcuStudio.App/bin/Release/net10.0/marelli-iaw-ecu-studio.exe" -ArgumentList "--report-theme", $report -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "the application did not exit" }
          Get-Content $report
          Write-Output "::notice title=Theme on Windows::$((Get-Content $report) -join ' ')"
          if (-not (Select-String -Path $report -Pattern "^window=Dark$" -Quiet)) { throw "the window does not follow the dark system theme" }

      - name: Follow the dark system theme (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Switch the whole system to dark as System Settings does; the defaults key alone
          # is not noticed by the running session.
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' \
            || defaults write -g AppleInterfaceStyle Dark
          report="$RUNNER_TEMP/theme.txt"
          ./src/MarelliIawEcuStudio.App/bin/Release/net10.0/marelli-iaw-ecu-studio --report-theme "$report" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill "$pid" 2>/dev/null || true
          if [ -f "$report" ]; then
            echo "::notice title=Theme on macOS::$(tr '\n' ' ' < "$report")"
            grep -qx 'window=Dark' "$report"
          else
            echo "::error title=Theme on macOS::no report; the application wrote: $(tail -c 600 "$RUNNER_TEMP/app.log" | tr '\n' ' ')"
            exit 1
          fi

      - name: Validate built-in definitions
        run: dotnet run --project src/MarelliIawEcuStudio.Cli --configuration Release --no-build -- validate src/MarelliIawEcuStudio.Core/Definitions

      - name: Simulator smoke test
        run: dotnet run --project src/MarelliIawEcuStudio.Cli --configuration Release --no-build -- read --simulate --no-broadcast --count 2

      - name: OBD simulator smoke test
        run: dotnet run --project src/MarelliIawEcuStudio.Cli --configuration Release --no-build -- obd read --simulate kwp-fast --params RPM,ECT

      - name: NuGet packages
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack --configuration Release --no-build --output packages

      - name: Upload NuGet packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: packages/*

  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish self-contained executables
        run: |
          for project in MarelliIawEcuStudio.App MarelliIawEcuStudio.Cli; do
            dotnet publish src/$project \
              --configuration Release \
              --runtime ${{ matrix.rid }} \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              --output publish/${{ matrix.rid }}
          done
          rm -f publish/${{ matrix.rid }}/*.pdb publish/${{ matrix.rid }}/*.xml

      - uses: actions/upload-artifact@v4
        with:
          name: marelli-iaw-ecu-studio-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
