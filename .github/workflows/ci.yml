name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test --configuration Release --no-build 2>&1 | tee test-output.txt
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots

      # The failed tests as one annotation, readable on the run summary page and through the API.
      - name: Report failed tests
        if: failure()
        shell: bash
        run: |
          details=$(grep -E -A14 '^[[:space:]]*failed ' test-output.txt | head -120 | tr -d '\r' | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
          echo "::error title=Failed tests on ${{ matrix.os }}::${details:-see the Test step}"

      - name: Upload UI screenshots
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Validate built-in definitions
        run: dotnet run --project src/MarelliIawEcuStudio.Cli --configuration Release --no-build -- validate src/MarelliIawEcuStudio.Core/Definitions

      - name: Simulator smoke test
        run: dotnet run --project src/MarelliIawEcuStudio.Cli --configuration Release --no-build -- read --simulate --no-broadcast --count 2

      - name: OBD simulator smoke test
        run: dotnet run --project src/MarelliIawEcuStudio.Cli --configuration Release --no-build -- obd read --simulate kwp-fast --params RPM,ECT

      - name: NuGet packages
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack --configuration Release --no-build --output packages

      - name: Upload NuGet packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: packages/*

  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish self-contained executables
        run: |
          for project in MarelliIawEcuStudio.App MarelliIawEcuStudio.Cli; do
            dotnet publish src/$project \
              --configuration Release \
              --runtime ${{ matrix.rid }} \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              --output publish/${{ matrix.rid }}
          done
          rm -f publish/${{ matrix.rid }}/*.pdb publish/${{ matrix.rid }}/*.xml

      - uses: actions/upload-artifact@v4
        with:
          name: marelli-iaw-ecu-studio-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
