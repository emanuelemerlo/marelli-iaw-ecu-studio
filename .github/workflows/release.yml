name: Release

# Push a tag such as v0.1.0-rc.1 to build self-contained executables and
# publish them as a GitHub release. Tags with a suffix (-rc.N, -beta.N, ...)
# are published as pre-releases.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Validate built-in definitions
        run: dotnet run --project src/MarelliIawEcuStudio.Cli --configuration Release --no-build -- validate src/MarelliIawEcuStudio.Core/Definitions

  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish self-contained executables
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="marelli-iaw-ecu-studio-${version}-${{ matrix.rid }}"
          for project in MarelliIawEcuStudio.App MarelliIawEcuStudio.Cli; do
            dotnet publish src/$project \
              --configuration Release \
              --runtime ${{ matrix.rid }} \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:Version="$version" \
              --output "publish/$out"
          done
          rm -f publish/$out/*.pdb publish/$out/*.xml
          cp LICENSE LICENSE-IES2 NOTICE README.md README.it.md "publish/$out/"
          mkdir -p dist
          cd publish
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            zip -qr "../dist/$out.zip" "$out"
          else
            tar -czf "../dist/$out.tar.gz" "$out"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cd ..
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          args=(--title "$GITHUB_REF_NAME" --verify-tag)
          if [[ -f "$notes" ]]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
